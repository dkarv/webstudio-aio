[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
priority=10
user=postgres
command=postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c port=5432
stopsignal=INT
stopwaitsecs=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:postgrest]
priority=20
user=nobody
command=sh -c 'until pg_isready -q -h 127.0.0.1 -p 5432; do sleep 0.5; done; exec postgrest'
startsecs=3
startretries=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:builder]
priority=30
user=node
directory=/app/apps/builder
command=node server.mjs
environment=HOME="/home/node"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true


# Consistent database snapshot for file-level backups of /data.
[program:pgdump]
priority=50
user=postgres
command=sh -c 'sleep 60; while true; do pg_dump -h /var/run/postgresql -Fc -d webstudio -f /data/backup/webstudio.dump.tmp && mv /data/backup/webstudio.dump.tmp /data/backup/webstudio.dump; sleep 21600; done'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
